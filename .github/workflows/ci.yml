name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Lint, type check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[local,azure,observability,dev]"

      - name: Ruff
        run: ruff check src tests

      - name: Mypy
        run: mypy src

      - name: Pytest
        # The Kaggle corpus is never committed, so data-dependent tests skip.
        # Retrieval parity is verified locally and in the evaluation job.
        run: pytest -q --cov=itops_rag --cov-report=term-missing

  web:
    name: Build React frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Build
        working-directory: web
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  docker:
    name: Build container image
    runs-on: ubuntu-latest
    needs: [python, web]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GHCR requires a lowercase repository path, but GitHub repository names
      # may contain capitals (e.g. TheBestCdr/ITOpsRag).
      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on branch builds)
        uses: docker/build-push-action@v6
        with:
          context: .
          # Push on any branch push so the image exists for deployment.
          # Pull requests only build, they never push.
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Secret and dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if Kaggle data was committed
        run: |
          if git ls-files | grep -E 'agent-eval-part-i-grounded-rag-benchmark|\.npy$|\.npz$|corpus\.csv|train\.csv|test\.csv'; then
            echo "::error::Kaggle data or generated artifacts must not be committed."
            exit 1
          fi
          echo "No data files committed."

      - name: Python dependency audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -e ".[azure,observability]"
          pip-audit --skip-editable || true
