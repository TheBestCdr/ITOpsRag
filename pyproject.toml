[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "itops-rag"
version = "1.0.0"
description = "Grounded RAG assistant for IT operations, over the Kaggle AgentEval corpus"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Local retrieval + extractive answers (notebook parity, no Azure needed)
local = [
    "sentence-transformers>=3.0",
]
# Azure AI Search + Azure OpenAI + managed identity
azure = [
    "azure-search-documents>=11.6",
    "azure-identity>=1.17",
    "openai>=1.40",
]
# Observability
observability = [
    "azure-monitor-opentelemetry>=1.6",
    "langsmith>=0.1.100",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
itops-rag-eval = "itops_rag.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's Depends() in argument defaults is the documented pattern.
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
